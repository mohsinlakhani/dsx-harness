name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install all dependency groups
        run: uv sync --all-groups --locked --python 3.12

      - name: Run exact offline coverage gate
        run: uv run pytest -m "not live" --cov=dsx.pilot --cov-branch --cov-fail-under=100

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src

      - name: Build package
        run: uv build
