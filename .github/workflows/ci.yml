name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install all dependency groups
        run: uv sync --all-groups --locked --python 3.12

      - name: Run exact offline coverage gate
        run: >-
          uv run pytest -m "not live"
          --cov=dsx.packet
          --cov=dsx.experiments.context_lift
          --cov=dsx.experiments.data_access
          --cov-branch
          --cov-fail-under=100

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src

      - name: Build package
        run: uv build
